<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lighthouse</title>
  <!--bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <!--fonts-->
  <link rel="stylesheet" href="https://use.typekit.net/rvu5noa.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abel&family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Dosis:wght@200..800&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet">
</head>

<body>
  <!--nav open-->
  <div class="background-img"><img src=""></div>


  <div class="container-fluid bodyContainer"><!--container open-->
    <div class="row">
      <div class="col-12 mainRow">
        <div class="row firstRow">
          <div class="col-12">
            <h1>Contact Us</h1>
            <hr class="gradHr">
          </div>
          <div class="col-0 col-md-3"></div>
          <div class="col-12 col-md-6">
            <div class="row">
              <div class="col-12 aboutRow">
                <div class="phoneCell">
                  39-192-924-2463
                </div>
                <div class="mailCell">
                  <a href="mailto:lighthouseGenoa@gmail.it" class="nonLink" target="_blank">lighthouseGenoa@gmail.it</a>
                </div>
              </div>
              <hr class="gradHr" height="2px">
            </div>
            <div class="row inputHolder">
              <div class="col-12 col-md-6">
                <div class="beforeMaker">
                  <input type="text" placeholder="First Name*" class="nameInput" id="first">
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="beforeMaker">
                  <input type="text" placeholder="Last Name*" class="nameInput" id="last">
                </div>
              </div>
              <div class="col-12">
                <div class="beforeMaker">
                  <input type="text" placeholder="email@address.com*" id="emailInput">
                </div>
              </div>
              <div class="col-12">
                <div class="beforeMaker">
                  <textarea rows="4" placeholder="Message*" id="message"></textarea>
                </div>
              </div>
              <div class="col-12 submitCol">
                <input type="submit" id="submit" onclick="submitMessage()">
              </div>
            </div>
          </div>
          <div class="col-0 col-md-3"></div>
        </div>
      </div>
    </div>

  </div><!--container close-->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
  <!--javascript alerts-->
  <div class="alerter" id="yes">
    <h2>Reservation Made!</h2>
  </div>
  <div class="alerter" id="no">
    <h2>All Tables are Full.</h2>
  </div>
  <div class="alerter" id="sent">
    <h2>Message Sent!</h2>
  </div>
  <div id="email">
    <div class="header">
      <span class="closeCell iconCell" onclick="emailFunc('close')"></span>
    </div>
    <div class="body" id="emailBody">
      <p class="headerP">To: lighthouseGenoa@gmail.it</p>
      <hr>
      <p id="fromEmail" class="headerP"></p>
      <hr>
      <h2 id="to"></h2>
      <p id="messageP"></p><br><br>
      <h3 id="from">Sincerely,<br><span id="name"></span></h3>
    </div>
    <div style="text-align: center;" onclick="sent()"><button class="confirmButton">Confirm and Send</button></div>
  </div>
</body>

</html>
