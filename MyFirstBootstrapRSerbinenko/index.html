<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <div class="container">
    <br>
    <kbd>My First Bootstrap Grid</kbd>
    
    <hr>

    <div class="row">
      <div class="col-4 bg-primary text-light">.col-4</div>
      <div class="col-4 bg-primary text-light">.col-4</div>
      <div class="col-4 bg-primary text-light">.col-4</div>
    </div>

    <div class="row">
      <div class="col-12 bg-primary text-light">.col-12
      </div>
    </div>

    <div class="row">
      <div class="col-6 bg-primary text-light">.col-6</div>
      <div class="col-6 bg-primary text-light">.col-6</div>
    </div>

    <div class="row">
      <div class="col-8 bg-primary text-light">.col-8</div>
      <div class="col-2 bg-primary text-light">.col-2</div>
      <div class="col-2 bg-primary text-light">.col-2</div>
    </div>
    
    <hr>

    <div class="row">
      <div class="col-lg-2 col-md-6 col-sm-12 bg-primary text-light">Column</div>
      <div class="col-lg-2 col-md-6 col-sm-12 bg-success text-light">Column</div>
      <div class="col-lg-2 col-md-6 col-sm-12 bg-primary text-light">Column</div>
      <div class="col-lg-2 col-md-6 col-sm-12 bg-success text-light">Column</div>
      <div class="col-lg-2 col-md-6 col-sm-12 bg-primary text-light">Column</div>
      <div class="col-lg-2 col-md-6 col-sm-12 bg-success text-light">Column</div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
    crossorigin="anonymous"></script>
</body>

</html>
